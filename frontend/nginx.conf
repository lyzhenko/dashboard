# Раздача SPA и прокси на бэкенд. Один origin, поэтому CORS не нужен.
# Имя сервиса backend:8000 — как в корневом docker-compose.yml.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # API бэкенда: путь /api/v1/... сохраняется без изменений
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Хешированные ассеты Vite и шрифты — можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кешируем, иначе после выкатки браузер покажет старую сборку
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA-fallback: любой неизвестный путь отдаёт приложение
    location / {
        try_files $uri $uri/ /index.html;
    }
}
